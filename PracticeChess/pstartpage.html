<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title> Chess </title>

    <style>
        /* --- INTRO SCREEN --- */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;

            /* 페이드아웃 */
            animation: fadeOut 2.5s ease-in-out forwards;
            animation-delay: 2s;
        }

        /* 로고 이미지 */
        #intro img {
            width: 300px;
            /* 크기 조절 가능 */
            opacity: 0;
            animation: logoFadeIn 1.5s ease-in-out forwards;
        }

        /* 메인 페이지 부분 */
        #main-content {
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            background: url("https://images.chesscomfiles.com/uploads/v1/images_users/tiny_mce/lp4/201902/hypermodernism2-52fe6b677ca96.jpg") center/cover no-repeat;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        #main-content.show {
            opacity: 1;
        }

        /* 로고 등장 애니메이션 */
        @keyframes logoFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 인트로 fade-out */
        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>

</head>

<body>

    <!-- INTRO (로고만 중앙에 표시) -->
    <div id="intro">
        <img src="KINGVIDIA Logo.png" alt="KINGVIDIA Logo">
    </div>

    <!-- 실제 페이지 부분 -->
    <div id="main-content">
        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Chess Game</title>
            <style>
                @import url('./pstartpage.css');
            </style>
        </head>

        <body>
            <header>
                <div>♕CHESS GAME♕</div>
            </header>
            <main>
                <button onclick="location.href='chess.html'">Start</button>
                <div class="menu-item" data-action="option">Option</div>
            </main>
            <footer>
                <div>creater by KINGVIDIA</div>
            </footer>


        </body>

        </html>
    </div>

    <script>
        // 인트로가 사라지는 시점에 main-content 나타나기
        window.onload = () => {
            setTimeout(() => {
                document.getElementById("main-content").classList.add("show");
            }, 2000);
        };
    </script>

</body>

</html>
